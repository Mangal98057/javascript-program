<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BackgroundColorChange</title>
</head>
<body>
    <div class="container">
        <h1>Background Color Change</h1>
        <p>This example demonstrates how to change the background color of the page every second using JavaScript.</p>
        <button id="start">Start Color Change</button>
        <button id="stop">Stop Color Change</button>
    </div>


    
</body>
<script>
    const randomColor = ()=>{
        const hexValues = '0123456789ABCDEF';
        let color = '#';
        for (let i = 0; i < 6; i++) {
            color += hexValues[Math.floor(Math.random() * 16)];
        }
        return color;
    };
    let intervalId;
    const startButton = document.getElementById("start").addEventListener("click",function(){
         intervalId=setInterval(function(){
            document.body.style.backgroundColor = randomColor();
        },1000);
    });
    const stopButton = document.getElementById("stop").addEventListener("click",function(){
        clearInterval(intervalId);
    });
</script>
</html>
