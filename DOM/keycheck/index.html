<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Check</title>
</head>
<body>
    <div id="insert">
        <h1>Key Check</h1>
        <div class="key">Press Any Key</div>
    </div>

    <script>
        const keyValue = document.getElementById('insert');

        window.addEventListener('keydown', (e) => {
            keyValue.innerHTML = `
                <div class="color">
                    <table border="1">
                        <tr>
                            <th>Key</th>
                            <th>Code</th>
                            <th>KeyCode</th>
                        </tr>
                        <tr>
                            <td>${e.key}</td>
                            <td>${e.code}</td>
                            <td>${e.keyCode}</td>
                        </tr>
                    </table>
                </div>
            `;
        });
    </script>
</body>
</html>
